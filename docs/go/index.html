<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DSH Remote · 正在连接</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#101116;color:#f6f7f9;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;text-align:center;padding:24px}
  .box{max-width:440px}
  h1{font-size:20px;margin:14px 0 8px}
  p{color:#b6bac2;font-size:14px;line-height:1.8;margin:0}
  .url{color:#679efe;word-break:break-all}
  a{display:inline-block;margin-top:18px;padding:12px 22px;background:#4176e6;color:#fff;border-radius:12px;text-decoration:none;font-weight:600}
</style>
</head>
<body>
<div class="box">
  <div style="font-size:44px">⌁</div>
  <h1>DSH Remote 正在连接你的电脑…</h1>
  <p id="status">读取最新地址中</p>
  <p id="fallback" style="display:none;margin-top:12px">最新地址：<span class="url" id="url"></span></p>
  <a id="open" style="display:none" href="#">打开 DSH Remote</a>
</div>
<script>
  var GIST = 'https://gist.githubusercontent.com/rs-lxy/c92d2c52be0ba0e5f15fb9705ebea014/raw/dsh-remote-url.txt';
  var status = document.getElementById('status');
  function fail(msg){
    status.textContent = msg;
    document.getElementById('fallback').style.display = 'block';
    var a = document.getElementById('open');
    a.style.display = 'inline-block';
    a.href = document.getElementById('url').textContent;
  }
  fetch(GIST, { cache: 'no-store' })
    .then(function(r){ return r.text(); })
    .then(function(t){
      var u = t.trim();
      var ok = /^https:\/\/[a-z0-9-]+\.lhr\.life$/.test(u);
      document.getElementById('url').textContent = u;
      if (ok) { status.textContent = '正在跳转：' + u; location.replace(u); }
      else fail('没有找到有效地址，请重试。');
    })
    .catch(function(){ fail('读取失败：请检查网络后重试。'); });
</script>
</body>
</html>
