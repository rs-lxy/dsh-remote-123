<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4176E6">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>DSH Remote · 登录</title>
<style>
  :root {
    --bg: #151517; --card: #232324; --input: #2c2c2e;
    --border: rgba(255,255,255,0.12); --border-strong: rgba(255,255,255,0.2);
    --label: #f9fafb; --label-2: #cfd3d6; --label-3: #adaeb2;
    --brand: rgb(65,118,230); --brand-hover: rgb(103,158,254);
    --error: rgb(248,113,113);
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f9fafb; --card: #ffffff; --input: #f3f4f6;
      --border: rgba(0,0,0,0.1); --border-strong: rgba(0,0,0,0.16);
      --label: #0f1115; --label-2: #61666b; --label-3: #81858c;
      --error: rgb(220,38,38);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
    background: var(--bg); color: var(--label);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .card {
    width: min(380px, 92vw); background: var(--card);
    border: 1px solid var(--border); border-radius: 16px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.25);
    padding: 28px 24px 22px;
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .mark {
    width: 44px; height: 44px; border-radius: 12px; flex: none;
    background: linear-gradient(135deg, #4D7CFE, #2F5BE7);
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 20px;
  }
  h1 { font-size: 18px; font-weight: 600; margin: 0; }
  p.sub { font-size: 12px; color: var(--label-3); margin: 4px 0 0; }
  p.hint { font-size: 13px; line-height: 1.8; color: var(--label-3); margin: 18px 0 16px; }
  label { display: block; font-size: 12px; color: var(--label-2); margin-bottom: 6px; }
  input {
    width: 100%; height: 44px; padding: 0 14px;
    background: var(--input); color: var(--label);
    border: 1px solid var(--border); border-radius: 10px;
    font-size: 16px; outline: none; transition: border-color .15s, box-shadow .15s;
  }
  input:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(65,118,230,0.25); }
  input::placeholder { color: var(--label-3); }
  button {
    width: 100%; height: 44px; margin-top: 16px;
    background: var(--brand); color: #fff; border: none; border-radius: 10px;
    font-size: 15px; font-weight: 600; cursor: pointer; transition: background .15s;
  }
  button:hover { background: var(--brand-hover); }
  .error {
    margin-top: 12px; padding: 9px 12px;
    background: rgba(248,113,113,0.12); color: var(--error);
    border: 1px solid rgba(248,113,113,0.3); border-radius: 10px;
    font-size: 13px; line-height: 1.5;
  }
  .foot { margin-top: 18px; font-size: 11px; line-height: 1.7; color: var(--label-3); text-align: center; }
  code { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 11px; }
</style>
</head>
<body>
  <form class="card" method="post" action="/login" autocomplete="on">
    <div class="brand">
      <div class="mark">⌁</div>
      <div>
        <h1>DSH Remote</h1>
        <p class="sub">DeepSeek Harness 远程控制</p>
      </div>
    </div>
    <p class="hint">输入电脑端生成的口令，即可远程操作电脑上正在运行的 DeepSeek Harness（会话、审批、工具执行与电脑端实时同步）。</p>
    <label for="token">口令 / Password</label>
    <input id="token" type="password" name="token" placeholder="••••••••" autofocus autocomplete="current-password" required>
    <button type="submit">登录并进入</button>
    __ERROR__
    <div class="foot">
      口令在电脑的 <code>~/.dsh/dsh-remote.auth</code> 文件中<br>
      iPhone 登录后：Safari 分享按钮 → “添加到主屏幕” → 像 App 一样使用
    </div>
  </form>
</body>
</html>
